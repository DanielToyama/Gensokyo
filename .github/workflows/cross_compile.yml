name: Auto Build & Release

# 每次 push 到 main 分支：自动打日期 tag → 构建 exe → 发布 Release
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'readme.md'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/*.yml'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            goarch: amd64
          - os: linux
            goarch: amd64
          - os: linux
            goarch: arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21.1'

    - name: Prepare webui/dist placeholder
      run: |
        # go:embed 需要 webui/dist 目录存在（前端产物未包含在源码仓库）
        mkdir -p webui/dist/css webui/dist/js webui/dist/fonts webui/dist/icons
        echo "" > webui/dist/index.html
        echo "" > webui/dist/css/app.css
        echo "" > webui/dist/js/app.js
        echo "" > webui/dist/fonts/font.woff
        echo "" > webui/dist/icons/icon.png

    - name: Compile for target
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p output
        if [ "$GOOS" = "windows" ]; then
          go build -ldflags="-s -w" -o output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}.exe
        else
          go build -ldflags="-s -w" -o output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
        path: output/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate date-based tag
      id: tag
      run: |
        TAG="v$(date +'%Y.%m.%d.%H%M%S')"
        echo "TAG=$TAG" >> $GITHUB_OUTPUT
        echo "生成 tag: $TAG"

    - name: Create tag
      env:
        TAG: ${{ steps.tag.outputs.TAG }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "$TAG" "${{ github.sha }}"
        git push origin "$TAG"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: output

    - name: Flatten artifacts
      run: |
        find output -type f \( -name "gensokyo-*" -o -name "gensokyo-*.exe" \) -exec cp {} output/ \; 2>/dev/null || true
        ls -la output/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.TAG }}
        name: Release ${{ steps.tag.outputs.TAG }}
        # 自动根据 tag 范围内的 commit 生成 release notes
        generate_release_notes: true
        files: |
          output/gensokyo-*
        draft: false
        prerelease: false
